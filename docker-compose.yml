version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - MEETING_BAAS_API_KEY=${MEETING_BAAS_API_KEY}
      - MEETING_BAAS_API_URL=${MEETING_BAAS_API_URL}
      - MEETING_BAAS_API_VERSION=${MEETING_BAAS_API_VERSION:-v2}
      - MEETING_BAAS_AUTH_HEADER=${MEETING_BAAS_AUTH_HEADER:-x-meeting-baas-api-key}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped